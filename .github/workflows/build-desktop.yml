name: Build Windows desktop app (.exe)

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'src/lib/sandbox/generated/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Generate shared files + bundle UI
        run: npm run build
      - name: Self test (5-second intro mute rules)
        run: npm test
      - name: Package (installer + portable)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: CineHub-Windows
          path: |
            desktop/release/*.exe
